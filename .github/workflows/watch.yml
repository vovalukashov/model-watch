name: model-watch

on:
  schedule:
    # каждые 10 минут (в публичном репозитории минуты Actions не тарифицируются);
    # GitHub может задерживать cron на 5–15 минут в часы пик
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      ai_selftest:
        description: "Send one AI summary of a recorded real run to Telegram (does not touch data/)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the job prove itself to ai-proxy with a GitHub OIDC token

concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Fetch, extract, diff, notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}   # https://<ai-proxy domain>/api; unset = no AI summary
          # REPORT_ERRORS: "1"   # раскомментируй, если хочешь получать в Telegram и ошибки скачивания
        run: python watch.py ${{ inputs.ai_selftest && '--ai-selftest' || '' }}

      - name: Commit snapshot
        run: |
          git config user.name "model-watch"
          git config user.email "model-watch@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
