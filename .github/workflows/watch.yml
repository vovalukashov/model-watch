name: model-watch

on:
  schedule:
    # A fallback only: GitHub ran */10 just every 3-5 hours, so the 10-minute rhythm comes from tick.yml.
    # The minutes avoid the top of the hour, GitHub's busiest time for schedules.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      ai_selftest:
        description: "Send one AI summary of a recorded real run to Telegram (does not touch data/)"
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write   # lets the job prove itself to ai-proxy with a GitHub OIDC token
  actions: read     # lets the fallback schedule see when the tick chain last started a check

concurrency:
  group: model-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: python -m unittest discover -v

      - name: Check that the tick chain is alive
        # Only the fallback schedule gets here: while tick.yml runs, it starts every check itself.
        if: github.event_name == 'schedule'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watch.py --check-chain

      - name: Fetch, extract, diff, notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}   # https://<ai-proxy domain>/api; unset = no AI summary
          # REPORT_ERRORS: "1"   # раскомментируй, если хочешь получать в Telegram и ошибки скачивания
        run: python watch.py ${{ inputs.ai_selftest && '--ai-selftest' || '' }}

      - name: Commit snapshot
        run: |
          git config user.name "model-watch"
          git config user.email "model-watch@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "snapshot $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
